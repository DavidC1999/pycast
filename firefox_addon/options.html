<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>PyCast Video Seek Settings</title>
        <style>
            body {
                max-width: 36rem;
                margin: 2rem auto;
                padding: 0 1rem;
                color: #202124;
                font: 16px/1.5 sans-serif;
            }

            label {
                display: block;
                margin-bottom: 0.4rem;
                font-weight: 600;
            }

            input {
                box-sizing: border-box;
                width: 100%;
                padding: 0.55rem;
            }

            button {
                margin-top: 0.8rem;
                padding: 0.5rem 0.9rem;
            }

            #status {
                min-height: 1.5em;
            }
        </style>
    </head>
    <body>
        <form id="server-form">
            <label for="server-url">WebSocket server URL</label>
            <input id="server-url" name="server-url" type="url" required>
            <button type="submit">Save</button>
            <p id="status" role="status" aria-live="polite"></p>
        </form>
        <script src="options.js"></script>
    </body>
</html>
