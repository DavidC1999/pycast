<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/pycast/manifest.webmanifest" />
    <title>PyCast</title>

    <style>
        * {
            width: calc(100% - 20px);
            margin: auto;
        }

        h1 {
            text-align: center;
            margin: 30px auto;
        }

        body {
            font-family: sans-serif;
        }

        #appView, #installView {
            padding-left: 10px;
            padding-right: 10px;
        }

        input[type=button] {
            background: white;
            border: 1px black solid;

            width: calc(100% - 12px);
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div id="installView" style="display: none;">
        <h1>PyCast</h1>
        <input type="button" value="Install!" id="installApp"/>
    </div>
    <div id="appView" style="display: none;">
        <h1>PyCast</h1>
        Hostname:<br/>
        <input type="text" id="hostnameInput"/><br/>
        Port:<br/>
        <input type="text" id="portInput"/><br/>
        <input type="button" id="saveHostname" value="Save">
    </div>
    <script>
        let deferredPrompt;

        function notInstalled()
        {
            document.getElementById("installView").style.display = "block";

            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
            });

            const installApp = document.getElementById('installApp');
            installApp.addEventListener('click', async () => {
                if (deferredPrompt !== null) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        deferredPrompt = null;
                    }
                }
            });
        }

        function installed()
        {
            const hostnameInput = document.getElementById("hostnameInput");
            const portInput = document.getElementById("portInput");
            const saveHostnameButton = document.getElementById("saveHostname");
            const hostnameKey = "hostname";
            const defaultPort = 8080;

            document.getElementById("appView").style.display = "block";

            let storedHostname = window.localStorage.getItem(hostnameKey);

            if (storedHostname == null) {
                storedHostname = ""
            }

            if (storedHostname.includes(":"))
            {
                const split = storedHostname.split(":");
                hostnameInput.value = split[0];
                portInput.value = split[1];
            }
            else
            {
                hostnameInput.value = storedHostname;
                portInput.value = defaultPort;
            }


            saveHostnameButton.addEventListener("click", () => {
                window.localStorage.setItem(hostnameKey, hostnameInput.value + ":" + portInput.value);
            })
        }

        if (window.matchMedia('(display-mode: standalone)').matches) {  
            installed();
        }
        else
        {
            notInstalled();
        }
        </script>
</body>
</html>
