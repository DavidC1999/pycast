<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/pycast/manifest.webmanifest" />
    <title>Document</title>
</head>
<body>
    <div id="installView" style="display: none;">
        <h1>PyCast install</h1>
        <input type="button" value="Install!" id="installApp"/>
    </div>
    <div id="appView" style="display: none;">
        <h1>PyCast app</h1>
        Hostname of PyCast device:<br/>
        <input type="text" id="hostnameInput"/><br/>
        <input type="button" id="saveHostname" value="Save">
    </div>
    <script>
        let deferredPrompt;

        function notInstalled()
        {
            document.getElementById("installView").style.display = "block";

            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
            });

            const installApp = document.getElementById('installApp');
            installApp.addEventListener('click', async () => {
                if (deferredPrompt !== null) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        deferredPrompt = null;
                    }
                }
            });
        }

        function installed()
        {
            const hostnameInput = document.getElementById("hostnameInput");
            const saveHostnameButton = document.getElementById("saveHostname");
            const hostnameKey = "hostname";

            document.getElementById("appView").style.display = "block";

            const storedHostname = window.localStorage.getItem(hostnameKey);
            hostnameInput.value = storedHostname;

            saveHostnameButton.addEventListener("click", () => {
                window.localStorage.setItem(hostnameKey, hostnameInput.value);
            })
        }

        installed();

        // if (window.matchMedia('(display-mode: standalone)').matches) {  
        //     installed();
        // }
        // else
        // {
        //     notInstalled();
        // }
        </script>
</body>
</html>
