<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>PyCast</title>

    <style>
        * {
            width: calc(100% - 20px);
            margin: auto;
        }

        h1 {
            text-align: center;
            margin: 30px auto;
        }

        body {
            font-family: sans-serif;
        }

        #appView, #installView {
            padding-left: 10px;
            padding-right: 10px;
        }

        input[type=button] {
            background: white;
            border: 1px black solid;

            width: calc(100% - 12px);
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div id="installView" style="display: none;">
        <h1>PyCast</h1>
        <input type="button" value="Install!" id="installApp"/>
    </div>
    <script>
        const baseUrl = window.location.href.split("/").slice(0, -1).join("/");

        if (window.matchMedia('(display-mode: standalone)').matches) {  
            // Installed, go to the app
            window.location.replace(baseUrl + "/app.html");
        }
        else
        {
            // Not yet installed, show the install button in the browser
            let deferredPrompt = null;
            
            document.getElementById("installView").style.display = "block";

            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
            });

            const installApp = document.getElementById('installApp');
            installApp.addEventListener('click', async () => {
                if (deferredPrompt !== null) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        deferredPrompt = null;
                    }
                }
            });
        }
        </script>
</body>
</html>
