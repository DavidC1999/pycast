<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.test.webmanifest" />
    <title>PyCast</title>

    <style> 
        body {
            font-family: sans-serif;
        }

        input[type=button] {
            background: white;
            border: 1px black solid;
        }

        input[type=button]:active {
            background: lightgray;
        }

        .container {
            width: min(90vw, 800px);
            margin: 0 auto;
        }

        .header {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #saveHostname {
            margin-top: 10px;
        }

        .form {
            display: flex;
            flex-direction: column;
        }

        #share {
            height: 30vh;
        }

        #separator {
            margin: 30px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>PyCast</h1>
        </div>
        <div class="main">
            <div id="shareForm" class="form">
                <input type="button" id="share" value="Open a link"/>
            </div>
            <hr id="separator"/>
            <div id="hostnameForm" class="form">
                <label>Hostname:</label>
                <input type="text" id="hostnameInput"/>
                <label>Port:</label>
                <input type="text" id="portInput"/><br/>
                <input type="button" id="saveHostname" value="Save">
            </div>
        </div>
    </div>
    <script>
        const hostnameInput = document.getElementById("hostnameInput");
        const portInput = document.getElementById("portInput");
        const shareLinkInput = document.getElementById("shareLinkInput");
        const saveHostnameButton = document.getElementById("saveHostname");
        const shareButton = document.getElementById("share");
        const hostnameForm = document.getElementById("hostnameForm");
        const shareForm = document.getElementById("shareForm");
        const separator = document.getElementById("separator");

        const hostnameKey = "hostname";
        const defaultPort = 8080;

        const baseUrl = window.location.href.split("/").slice(0, -1).join("/");

        let hostname = window.localStorage.getItem(hostnameKey);

        function main() {
            if (hostname == null) {
                hostname = "";
            }

            if (hostname.includes(":"))
            {
                const split = hostname.split(":");
                hostnameInput.value = split[0];
                portInput.value = split[1];
            }
            else
            {
                hostnameInput.value = hostname;
                portInput.value = defaultPort;
            }

            saveHostnameButton.addEventListener("click", () => {
                const newHostName = hostnameInput.value + ":" + portInput.value;
                window.localStorage.setItem(hostnameKey, newHostName);
                window.location.replace("http://" + newHostName + "/")
            });

            if (hostname.length > 0) {
                shareButton.addEventListener("click", () => {
                    window.location.replace("http://" + hostname + "/");
                });
            } else {
                shareButton.style.display = "none";
                separator.style.display = "none";
            }
        }

        main();
    </script>
</body>
</html>
