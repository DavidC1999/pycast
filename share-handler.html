<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Shared link:</h1>
    <table>
        <tbody>
            <tr>
                <td>Full</td>
                <td id="full"></td>
            </tr>
            <tr>
                <td>Name</td>
                <td id="name"></td>
            </tr>
            <tr>
                <td>Description</td>
                <td id="description"></td>
            </tr>
            <tr>
                <td>Link</td>
                <td id="link"></td>
            </tr>
            <tr>
                <td>Stored hostname</td>
                <td id="hostname"></td>
            </tr>
        </tbody>
    </table>

    <script>
        const url = new URL(document.location);
        const sharedName = url.searchParams.get("name");
        const sharedDescription = url.searchParams.get("description");
        const sharedLink = url.searchParams.get("link");

        const hostnameKey = "hostname"
        const hostname = window.localStorage.getItem(hostnameKey);

        document.getElementById("full").innerHTML = url.toString();
        document.getElementById("name").innerHTML = sharedName;
        document.getElementById("description").innerHTML = sharedDescription;
        document.getElementById("link").innerHTML = sharedLink;
        document.getElementById("hostname").innerHTML = hostname;

        if (hostname) {
            let newUrl = "http://" + hostname + "/"
            
            let paramSign = "?";

            if (sharedName) {
                newUrl += paramSign + "name=" + sharedName
                paramSign = "&";
            }
            if (sharedDescription) {
                newUrl += paramSign + "description=" + sharedDescription
                paramSign = "&";
            }
            if (sharedLink) {
                newUrl += paramSign + "link=" + sharedLink
                paramSign = "&";
            }

            if (paramSign != "?") {
                window.location.replace(newUrl)
            }
        }
    </script>
</body>
</html>
