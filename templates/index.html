<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.test.webmanifest" />
    <title>PyCast</title>

    <style> 
        body {
            font-family: sans-serif;
        }

        input[type=button], button {
            background: white;
            border: 1px black solid;
        }

        input[type=button]:active, button:active {
            background: lightgray;
        }

        .container {
            width: min(90vw, 800px);
            margin: 0 auto;
        }

        .header {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .form {
            display: flex;
            flex-direction: column;
        }

        .formSubmit {
            margin-top: 10px;
        }

        .controlLinks {
            display: flex;
            gap: 10px;
        }

        .controlLinks button img {
            width: 50px;
            height: 50px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>PyCast</h1>
        </div>
        <div class="main">
            <div id="shareForm" class="form">
                <label>Share link:</label>
                <input type="url" id="shareLinkInput"/>
                <input type="button" id="share" class="formSubmit" value="Go!"/>
            </div>
            <h2>Jump to control:</h2>
            <div class="controlLinks">
                <button id="youtubeControl"><img src="./asset/yt.png" alt="YouTube"></button>
                <button id="internetControl"><img src="./asset/internet.png" alt="Internet"></button>
            </div>
        </div>
    </div>
    <script>
        const shareLinkInput = document.getElementById("shareLinkInput");
        const shareButton = document.getElementById("share");
        const shareForm = document.getElementById("shareForm");
        const youtubeControlLink = document.getElementById("youtubeControl");
        const internetControlLink = document.getElementById("internetControl");

        const baseUrl = window.location.href.split("/").slice(0, -1).join("/");

        function tryParse(text) {
            if (text == null) {
                return false;
            }

            let youtubeShortMatch = text.match(/(https?:\/\/(www\.)?)?youtu\.be\/(?<id>[^?&#]+)/);
            if (youtubeShortMatch) {
                let id = youtubeShortMatch.groups.id

                window.location.replace(window.location.origin + "/youtube/" + id);
                return true;
            }

            let youtubeMatch = text.match(/(https?:\/\/(www\.)?)?youtube\.com\/watch\?v=(?<id>[^?&#]+)/);
            if (youtubeMatch) {
                let id = youtubeMatch.groups.id

                window.location.replace(window.location.origin + "/youtube/" + id);
                return true;
            }

            let urlMatch = text.match(/[-a-zA-Z0-9@:%._\+~#=]{1,256}\.[a-zA-Z0-9()]{1,6}\b([-a-zA-Z0-9()@:%_\+.~#?&\/\/=]*)/);
            if (urlMatch) {
                window.location.replace(window.location.origin + "/website/" + text);
                return true;
            }

            return false;
        }

        shareButton.addEventListener("click", () => {
            tryParse(shareLinkInput.value);
        });

        youtubeControlLink.addEventListener("click", () => {
            window.location.replace(window.location.origin + "/youtube")
        });

        internetControlLink.addEventListener("click", () => {
            window.location.replace(window.location.origin + "/website")
        });

        const url = new URL(document.location);
        const shareName = url.searchParams.get("name");
        const shareDescription = url.searchParams.get("description");
        const shareLink = url.searchParams.get("link");

        const checkUrls = [shareLink, shareDescription, shareName]
        for (urlToCheck of checkUrls) {
            if (tryParse(urlToCheck)) {
                break;
            }
        }
    </script>
</body>
</html>
