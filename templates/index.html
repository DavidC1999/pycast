<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.test.webmanifest" />
    <title>PyCast</title>

    <style> 
        body {
            font-family: sans-serif;
        }

        input[type=button], button {
            background: white;
            border: 1px black solid;
        }

        input[type=button]:active, button:active {
            background: lightgray;
        }

        .container {
            width: min(90vw, 800px);
            margin: 0 auto;
        }

        .header {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .form {
            display: flex;
            flex-direction: column;
        }

        .formSubmit {
            margin-top: 10px;
        }

        .explain {
            font-size: small;
        }

        {% if not active_control %}
        #activeControlForm {
            display: none;
        }
        {% endif %}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>PyCast</h1>
        </div>
        <div class="main">
            <div class="form">
                <label>Share link:</label>
                <input type="url" id="shareLinkInput"/>
                <input type="button" id="share" class="formSubmit" value="Go!"/>
            </div>
            <div class="form" id="activeControlForm">
                <h2>Jump to control:</h2>
                <input type="button" id="goToControl" class="formSubmit" value="Jump to active control"/>
            </div>
            <div class="form">
                <h2>Profile name:</h2>
                <span class="explain">The name of the Firefox profile, which allows users of the same PyCast instance to e.g. log into their personal accounts and install their own preferred extensions.</span>
                <input type="text" id="profileInput"/>
            </div>
        </div>
    </div>
    <script>
        const shareLinkInput = document.getElementById("shareLinkInput");
        const shareButton = document.getElementById("share");
        const goToControlButton = document.getElementById("goToControl");
        const profileInput = document.getElementById("profileInput");

        const baseUrl = window.location.href.split("/").slice(0, -1).join("/");

        const profileKey = "profile";
        
        let profileValue = window.localStorage.getItem(profileKey);
        if (profileValue == null) {
            profileValue = "pycast";
        }

        profileInput.value = profileValue;

        function go(place) {
            document.getElementsByClassName("container")[0].style.display = "none";
            window.location.replace(window.location.origin + place + "?profile=" + profileInput.value);
        }

        function tryParse(text) {
            if (text == null) {
                return false;
            }

            let youtubeShortMatch = text.match(/.*(https?:\/\/(www\.)?)?youtu\.be\/(?<id>[^?&#]+).*/);
            if (youtubeShortMatch) {
                let id = youtubeShortMatch.groups.id
                
                document.body.style.display = "none"; // Display empty page while we're loading.
                go("/youtube/" + id);
                return true;
            }

            let youtubeMatch = text.match(/.*(https?:\/\/(www\.)?)?youtube\.com\/watch\?v=(?<id>[^?&#]+).*/);
            if (youtubeMatch) {
                let id = youtubeMatch.groups.id

                go("/youtube/" + id);
                return true;
            }

            let npoMatch = text.match(/.*(?<url>https?:\/\/(www\.)?npo\.nl\/?([^\/\n]+\/)*[^\/\n]+).*/);
            if (npoMatch) {
                let url = npoMatch.groups.url;
                go("/npo/" + url);
                return true;
            }

            let urlMatch = text.match(/.*(?<url>https?:\/\/([^\/.]+\.)*[^.\/]+\/?([^\/\n]+\/)*[^\/\n]+).*/);
            if (urlMatch) {
                let url = urlMatch.groups.url
                go("/website/" + url);
                return true;
            }

            return false;
        }

        shareButton.addEventListener("click", () => {
            tryParse(shareLinkInput.value);
        });

        profileInput.addEventListener("change", () => {
            window.localStorage.setItem(profileKey, profileInput.value);
        });

        goToControlButton.addEventListener("click", () => {
            go("/active-control")
        });

        const url = new URL(document.location);
        const shareName = url.searchParams.get("name");
        const shareDescription = url.searchParams.get("description");
        const shareLink = url.searchParams.get("link");

        const checkUrls = [shareLink, shareDescription, shareName]

        for (urlToCheck of checkUrls) {
            if (tryParse(urlToCheck)) {
                break;
            }
        }
    </script>
</body>
</html>
