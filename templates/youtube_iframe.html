<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube - PyCast</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
        }
        #player {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="player"></div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>

        let player;
        let ws;

        const params = new URLSearchParams(window.location.search);

        function getVideoId() {
            return params.get('video_id') || '';
        }

        function getStartAt() {
            return params.get('start_at') || '';
        }

        function getAutoPlay() {
            let cc = params.get('autoplay') || '';
            if (cc.toLowerCase() === 'true') {
                return true;
            }
            return false
        }

        function isPlaying() {
            return player.getPlayerState() === YT.PlayerState.PLAYING;
        }

        function getCCEnabled() {
            let cc = params.get('cc') || '';
            if (cc.toLowerCase() === 'true') {
                return true;
            }
            return false
        }

        function sendStatus() {
            if (!player || !player.getCurrentTime) {
                console.warn('Player not ready yet');
                return;
            }
            ws.send(JSON.stringify(
                {
                    current_time: player.getCurrentTime(),
                    is_playing: player.getPlayerState() === YT.PlayerState.PLAYING,
                    cc_enabled: getCCEnabled()
                }
            ));
        }

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: getVideoId(),
                playerVars: {
                    autoplay: getAutoPlay() ? 1 : 0,
                    controls: 1,
                    cc_load_policy: getCCEnabled() ? 1 : 0,
                    start: getStartAt() ? parseInt(getStartAt()) : 0
                }
            });
            connectWebSocket();
        }

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = protocol + '//' + window.location.host + '/youtube-commands';
            
            ws = new WebSocket(wsUrl);
            
            ws.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    executeCommand(data);
                } catch (e) {
                    console.error('Failed to parse command:', e);
                }
            };
            
            ws.onerror = function(event) {
                console.error('WebSocket error:', event);
            };
            
            ws.onclose = function(event) {
                console.log('WebSocket closed, reconnecting in 3 seconds...');
                setTimeout(connectWebSocket, 3000);
            };

            sendStatus();
            setInterval(() => {
                sendStatus();
            }, 1000);
        }

        function executeCommand(data) {
            if (!player) {
                console.warn('Player not ready yet');
                return;
            }

            const command = data.command;
            let newLocation;
            switch (command) {
                case 'togglePlay':
                    const state = player.getPlayerState();
                    if (state === YT.PlayerState.PLAYING) {
                        player.pauseVideo();
                    } else {
                        player.playVideo();
                    }
                    sendStatus();
                    break;
                case 'seek':
                    if (data.seconds !== undefined) {
                        const newTime = Math.max(0, player.getCurrentTime() + data.seconds);
                        player.seekTo(newTime, true);
                    }
                    sendStatus();
                    break;
                case 'jump':
                    if (data.seconds !== undefined) {
                        const newTime = Math.max(0, data.seconds);
                        player.seekTo(newTime, true);
                    }
                    sendStatus();
                    break;
                case 'reload':
                    location.reload();
                    break;
                case 'toggleCaptions':
                    newLocation = window.location.origin + window.location.pathname
                            + '?video_id=' + getVideoId()
                            + '&start_at=' + player.getCurrentTime()
                            + '&autoplay=' + isPlaying();
                    
                    if (getCCEnabled()) {
                        newLocation += '&cc=false';
                    } else {
                        newLocation += '&cc=true';
                    }

                    window.location.replace(newLocation);
                    break;
                case 'setVolume':
                    if (data.volume !== undefined) {
                        player.setVolume(Math.max(0, Math.min(100, data.volume)));
                    }
                    break;
                default:
                    console.warn('Unknown command:', command);
            }
        }

        // Make onYouTubeIframeAPIReady globally available
        window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;
    </script>
</body>
</html>
